appId: com.coastlet.builder
productName: Coastlet Builder
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: assets/build

asar: false

files:
  - src/**/*
  - assets/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  # No custom icon — uses default Electron icon

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.games

linux:
  target:
    - AppImage
  category: Game
