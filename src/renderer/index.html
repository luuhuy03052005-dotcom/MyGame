<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Coastlet Builder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    /* Canvas Three.js — full window */
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Loading screen — premium light glassmorphism */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(145deg, #e8f4f8 0%, #dce9f5 40%, #f0f4f8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.6s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #2D3748;
      margin-bottom: 28px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #loading-bar-track {
      width: 220px;
      height: 4px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    #loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7FB3D3, #A8D8EA, #B8E0F7);
      border-radius: 4px;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #loading-status {
      margin-top: 14px;
      font-size: 11px;
      color: rgba(45, 55, 72, 0.45);
      letter-spacing: 0.06em;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- Canvas — Three.js renderer gắn vào đây -->
  <canvas id="canvas"></canvas>

  <!-- Loading screen — ẩn đi sau khi AssetManager.preload() xong -->
  <div id="loading-screen">
    <div id="loading-title">COASTLET BUILDER</div>
    <div id="loading-bar-track">
      <div id="loading-bar-fill"></div>
    </div>
    <div id="loading-status">Initializing...</div>
  </div>

  <!-- UI overlay (Phase 5) — empty placeholder -->
  <div id="ui-root"></div>

  <!-- Entry point renderer — load như ES Module -->
  <script type="module" src="./app.js"></script>
</body>
</html>
