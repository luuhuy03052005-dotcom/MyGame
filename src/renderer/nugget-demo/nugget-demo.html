<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nugget8 Ocean Demo — Proof of Life</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: Calibri, system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* Menu button — top right */
    body > button {
      position: fixed;
      z-index: 10;
      top: 12px;
      right: 12px;
      width: 48px;
      height: 32px;
      border-radius: 6px;
      background-color: rgba(255,255,255,0.5);
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Overlay menu */
    #overlay {
      position: fixed;
      display: flex;
      z-index: 20;
      justify-content: center;
      align-items: center;
      inset: 0;
      background-color: rgba(0,0,0,0.5);
      overflow-y: scroll;
      opacity: 1;
      transition: opacity 300ms;
    }
    #overlay.hidden {
      pointer-events: none;
      opacity: 0;
    }

    #menu-panel {
      background-color: rgba(255,255,255,0.85);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      min-width: 300px;
    }
    #menu-panel h2 {
      margin-bottom: 16px;
      font-size: 20px;
    }
    #menu-panel p {
      margin: 8px 0;
      font-size: 13px;
      color: #555;
    }
    #menu-panel button {
      width: 200px;
      height: 36px;
      margin: 8px;
      border-radius: 6px;
      border: none;
      background-color: rgba(0,0,0,0.15);
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }
    #menu-panel button:hover {
      background-color: rgba(0,0,0,0.25);
    }

    /* Debug info — bottom left */
    #debug-info {
      position: fixed;
      z-index: 10;
      bottom: 8px;
      left: 8px;
      padding: 4px 8px;
      font-size: 12px;
      background-color: rgba(255,255,255,0.7);
      border-radius: 4px;
      pointer-events: none;
    }

    /* Console log panel — top left */
    #console-panel {
      position: fixed;
      z-index: 10;
      top: 8px;
      left: 8px;
      width: 400px;
      max-height: 200px;
      overflow-y: auto;
      background-color: rgba(0,0,0,0.85);
      color: #0f0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 4px;
      pointer-events: none;
    }
    #console-panel .error { color: #f55; }
    #console-panel .warn { color: #fa0; }
    #console-panel .info { color: #5cf; }
  </style>
</head>
<body>
  <!-- Canvas injected by JS -->

  <!-- Menu button -->
  <button id="menu-btn">Menu</button>

  <!-- Overlay menu -->
  <div id="overlay" class="hidden">
    <div id="menu-panel">
      <h2>Nugget8 Ocean Demo</h2>
      <p>Controls: WASD / Q / E to move | Mouse drag to look | ESC for menu</p>
      <p>Click to lock mouse pointer</p>
      <button id="resume-btn">Resume</button>
      <button id="info-btn">About</button>
    </div>
  </div>

  <!-- Debug info -->
  <div id="debug-info"></div>

  <!-- Console log panel -->
  <div id="console-panel"></div>

  <script type="module" src="./nugget-demo.js"></script>
</body>
</html>
